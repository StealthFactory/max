name: Diagnose max validation

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact commit on StealthFactory/ok main to validate
        required: true
        type: string

      scope:
        description: Validation scope
        required: true
        default: all
        type: choice
        options:
          - all
          - native-failures

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'StealthFactory/max'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Validate the requested source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch('[0-9a-f]{40}', os.environ['SOURCE_COMMIT']):
              raise SystemExit('Provide an exact source commit')
          PY
      - name: Check out private source for validation only
        uses: actions/checkout@v6
        with:
          repository: StealthFactory/ok
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Verify main ancestry
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate with private hang samples
        if: inputs.scope == 'all'
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys, threading, time
          root = pathlib.Path.cwd()
          logs = pathlib.Path(os.environ['RUNNER_TEMP'])
          stopped = threading.Event()
          def sample_stalls():
              seen, sampled = {}, set()
              while not stopped.wait(1):
                  listing = subprocess.run(['pgrep', '-x', 'ModelTests'], text=True, capture_output=True)
                  for raw in listing.stdout.splitlines():
                      if not raw.isdigit():
                          continue
                      pid = int(raw)
                      seen.setdefault(pid, time.monotonic())
                      if pid in sampled or time.monotonic() - seen[pid] < 110:
                          continue
                      sampled.add(pid)
                      sample = logs / f'max-hang-{pid}.txt'
                      try:
                          subprocess.run(['sample', str(pid), '1', '-file', str(sample)],
                                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=5)
                      except subprocess.TimeoutExpired:
                          print('Probe: native stack sampler timed out', flush=True)
                          continue
                      text = sample.read_text(errors='replace') if sample.exists() else ''
                      labels = {
                          'verifyTextSelectionAppearance': 'text-selection test',
                          'verifyBlockDragSelection': 'block-drag test',
                          'verifyBlockMovement': 'block-movement test',
                          'verifyEditorBugReports': 'editor-report test',
                          'verifyMountedEditorInteractions': 'mounted-editor test',
                          'mouseDown': 'mouse-down tracking',
                          'nextEventMatchingMask': 'native event wait',
                          'IconServices': 'system icon service',
                      }
                      matches = [label for symbol, label in labels.items() if symbol in text]
                      print('Probe: slow native process sampled; ' + (', '.join(matches) or 'no known wait signature'), flush=True)
          worker = threading.Thread(target=sample_stalls, daemon=True)
          worker.start()
          try:
              result = subprocess.run([sys.executable, 'scripts/check_release_build.py'])
          finally:
              stopped.set()
              worker.join(timeout=6)
          raise SystemExit(result.returncode)
          PY
      - name: Diagnose the failing native fixtures
        if: inputs.scope == 'native-failures'
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re, signal, subprocess, sys, time
          logs = pathlib.Path(os.environ['RUNNER_TEMP'])
          allowed_files = {p.name for p in pathlib.Path('macos/Tests').glob('*.swift')}
          assertion = re.compile(r'Native assertion: ([A-Za-z][A-Za-z0-9]*\.swift):([1-9]\d*)')
          metric = re.compile(r'Native metric: (?:preview\.(?:requested-right|host-width|host-height|screen-width|screen-height|cells|editing|cell-[01]\.(?:x|y|width|height|hidden|visible-width|visible-height))|reference\.stage|page-scroll\.(?:wall-p95|sync-p95|yield-p95)|daily\.(?:wall-p95|sync-p95|yield-p95|wrong-direction|idle-drift|content-drift)|cadence\.(?:page|daily)\.(?:baseline-count|baseline-p95|baseline-max|count|hz|p95|max))=-?\d+(?:\.\d+)?')
          def report(line):
              value = line.strip()
              match = assertion.fullmatch(value)
              if (match and match[1] in allowed_files) or metric.fullmatch(value):
                  print(value, flush=True)
          def run(label, command, extra=None, timeout=600):
              print(f'Probe: {label} started', flush=True)
              started = time.monotonic()
              path = logs / f'max-probe-{label}.log'
              with path.open('w') as output:
                  process = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT,
                      env=dict(os.environ, PYTHONUNBUFFERED='1', **(extra or {})), start_new_session=True)
                  try:
                      while True:
                          remaining = timeout - (time.monotonic() - started)
                          if remaining <= 0:
                              raise subprocess.TimeoutExpired(command, timeout)
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'Probe: {label} running for {time.monotonic() - started:.0f} seconds', flush=True)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait(timeout=5)
                      code = 124
              for line in path.read_text(errors='replace').splitlines():
                  report(line)
              print(f'Probe: {label} completed; exit={code}; elapsed={time.monotonic() - started:.1f}', flush=True)
              return code
          if run('rust-build', ['cargo', 'build', '--release', '--locked']):
              raise SystemExit(1)
          pointer = run('pointer', [sys.executable, 'scripts/test_native.py'], {'OK_POINTER_ONLY': '1'})
          binary = pathlib.Path('.build/ModelTests')
          if not binary.exists():
              raise SystemExit('Native test compilation did not produce the fixture executable')
          failed = bool(pointer)
          for group in ['mounted-editing', 'navigation', 'reference-layout', 'daily-media', 'scroll-cadence']:
              code = run(group, [str(binary.resolve())],
                  {'OK_NATIVE_GROUP': group, 'OK_NATIVE_DIAGNOSTICS': '1'}, timeout=120)
              failed = failed or bool(code)
          raise SystemExit(1 if failed else 0)
          PYTHON
